<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="APEX RUSH – Arcade-Rennspiel im Browser für bis zu 10 Spieler." />
    <title>APEX RUSH</title>
    <style>#boot{z-index:50;color:#e8ecff;background:radial-gradient(at 50% 60%,#2a0b4a 0%,#05060f 70%);flex-direction:column;justify-content:center;align-items:center;gap:1.2rem;font-family:system-ui,sans-serif;transition:opacity .5s;display:flex;position:fixed;inset:0}#boot .logo{letter-spacing:.06em;text-shadow:0 0 24px #00e5ff99;font-size:clamp(2.5rem,8vw,5rem);font-style:italic;font-weight:900}#boot .logo span{color:#ff2bd6;text-shadow:0 0 24px #ff2bd6b3}#boot .bar{background:#ffffff1f;border-radius:2px;width:min(320px,70vw);height:4px;overflow:hidden}#boot .bar i{background:linear-gradient(90deg,#00e5ff,#ff2bd6);width:40%;height:100%;animation:1.1s ease-in-out infinite boot;display:block}#boot p{letter-spacing:.18em;text-transform:uppercase;opacity:.7;font-size:.85rem}#boot.done{opacity:0;pointer-events:none}@keyframes boot{0%{transform:translate(-100%)}to{transform:translate(250%)}}</style>
    <script type="module" crossorigin src="/Race/assets/index-ZvbkcR95.js"></script>
    <link rel="modulepreload" crossorigin href="/Race/assets/three-DePVKFQh.js">
    <link rel="modulepreload" crossorigin href="/Race/assets/peerjs-BDCvW2CK.js">
    <link rel="stylesheet" crossorigin href="/Race/assets/index-C6cl1d_A.css">
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite"><div class="logo">APEX <span>RUSH</span></div><div class="bar"><i></i></div><p>Lädt …</p></div>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="ui">
      <main id="title">
        <button id="lang" class="lang-toggle" type="button" data-testid="lang" aria-label="Sprache / Language"></button>
        <div class="sound-ctl" data-testid="sound">
          <button id="mute" type="button" aria-label="Ton an/aus" title="Ton an/aus (M)" data-testid="mute">🔊</button>
          <input id="volume" type="range" min="0" max="100" step="5" aria-label="Lautstärke" title="Lautstärke" data-testid="volume" />
          <span class="sound-label" aria-hidden="true">♪</span>
          <input id="music" type="range" min="0" max="100" step="5" aria-label="Musik" title="Musik" data-testid="music" />
        </div>
        <h1 class="logo">APEX <span>RUSH</span></h1>
        <p class="tagline">Neon-Arcade-Racing für bis zu 10 Spieler – direkt im Browser.</p>
        <div class="menu">
          <button id="race" class="btn" type="button">Rennen gegen Bots</button>
          <button id="cup" class="btn" type="button" data-testid="grand-prix">Grand Prix</button>
          <button id="timetrial" class="btn btn-ghost" type="button" data-testid="timetrial">Zeitrennen</button>
          <button id="drift" class="btn btn-ghost" type="button" data-testid="drift">Drift-Challenge</button>
          <button id="online" class="btn" type="button" data-testid="online">Online spielen</button>
          <button id="garage" class="btn btn-ghost" type="button" data-testid="garage">Garage</button>
          <button id="settings" class="btn btn-ghost" type="button" data-testid="open-settings">Einstellungen</button>
          <button id="start" class="btn btn-ghost" type="button">Testgelände</button>
        </div>
        <div class="track-pick" data-testid="track-pick">
          <button class="tp-arrow" type="button" data-dir="-1" aria-label="Vorherige Strecke">◀</button>
          <div class="tp-info"><small>Strecke · <span data-field="track-cup">Neon Cup</span></small><b data-field="track-name">Neon Harbor</b><span data-field="track-blurb"></span></div>
          <button class="tp-arrow" type="button" data-dir="1" aria-label="Nächste Strecke" data-testid="track-next">▶</button>
        </div>
        <div class="weather-pick" data-testid="weather-pick"></div>
        <label class="chaos-toggle"><input type="checkbox" data-testid="chaos-toggle" /> <span>Chaos-Modus (Power-ups)</span></label>
        <p class="hint">3 Runden · bis zu 10 Spieler · Enter startet ein Rennen gegen Bots</p>
        <p class="status" data-testid="status">8 Strecken · 12 Autos · APEX-AI fährt mit</p>
      </main>
    </div>
  </body>
</html>
